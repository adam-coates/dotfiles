add_newline = true
command_timeout = 200
format = "[$directory$git_branch$git_status$python]($style)$character"

[character]
success_symbol = "[>](bold green)"
error_symbol = "[x](bold red)"
vimcmd_symbol = "[<](bold green)"

[directory]
truncation_length = 2
truncation_symbol = "…/"
read_only = " ro"
repo_root_style = "bold cyan"
repo_root_format = "[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "

[git_branch]
symbol = "git "
format = "[$branch]($style) "
style = "italic cyan"

[git_commit]
tag_symbol = " tag "

[git_status]
format     = '[$all_status]($style)'
style      = "cyan"
ahead      = ">"
behind     = "<"
diverged   = "<>"
renamed    = "r"
deleted    = "x"
conflicted = " "
up_to_date = " "
untracked  = "? "
modified   = " "
stashed    = ""
staged     = ""

